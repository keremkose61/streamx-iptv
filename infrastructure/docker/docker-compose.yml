version: '3.8'

services:
  # Nginx Web & Reverse Proxy
  web:
    image: nginx:alpine
    container_name: streamx_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../apps/web/dist:/usr/share/nginx/html/web:ro
      - ../../backend:/var/www/html:ro
    depends_on:
      - app
    networks:
      - streamx_net

  # Laravel 11 Backend (PHP 8.3-FPM)
  app:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    container_name: streamx_app
    restart: unless-stopped
    working_dir: /var/www/html/backend
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: streamx_db
      DB_USERNAME: streamx_user
      DB_PASSWORD: streamx_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ../../backend:/var/www/html/backend
      - ../../backend/storage:/var/www/html/backend/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - streamx_net

  # MySQL 8.4 Database
  db:
    image: mysql:8.4
    container_name: streamx_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: streamx_db
      MYSQL_USER: streamx_user
      MYSQL_PASSWORD: streamx_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "streamx_user", "-pstreamx_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - streamx_net

  # Redis In-Memory Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: streamx_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - streamx_net

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local

networks:
  streamx_net:
    driver: bridge
